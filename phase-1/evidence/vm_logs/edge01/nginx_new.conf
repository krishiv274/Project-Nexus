upstream cn_backends {
    server 10.211.55.7:3001;
    server 10.211.55.8:3002;
}

server {
    listen 80;
    listen [::]:80;

    server_name app.cn.test;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name app.cn.test;

    ssl_certificate /etc/nginx/cn-certs/app.cn.test.crt;
    ssl_certificate_key /etc/nginx/cn-certs/app.cn.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://cn_backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}