# NOTE: reconstructed from PHASE2_GUIDE.md Step 1.1 (the copy collected from dns01 was taken after the Phase 1 rollback).
# CN Project - Private DNS (PRIMARY, dns01) - Phase 2

# Listen only on the DNS server's LAN address.
listen-address=10.211.55.5
bind-interfaces

# Upstream DNS server; do not read /etc/resolv.conf (it points to 127.0.0.53 and can loop back here)
no-resolv
server=10.211.55.1

# Never forward plain names / private reverse lookups upstream
domain-needed
bogus-priv

# We are the only source of truth for *.cn.test (unknown names -> NXDOMAIN, never forwarded)
local=/cn.test/

# TTL for our own records (Phase 1 was 0 = never cached)
local-ttl=30

# Log every query (proof of which DNS server answered)
log-queries

# ---- Private project records ----
host-record=app.cn.test,10.211.55.6
host-record=api.cn.test,10.211.55.6
